<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in or Register — Hunar Marketplace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Domine:wght@400;500;600;700&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="nav">
  <div class="nav__inner">
    <a href="index.html" class="nav__brand">Hunar</a>
    <nav class="nav__links">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="wishlist.html">Wishlist</a>
      <a href="cart.html">Cart <span class="cart-badge" id="cartCount">0</span></a>
    </nav>
    <div class="nav__right" id="navAccountArea"></div>
    <button class="nav__burger" id="navBurger" aria-label="Toggle menu" aria-expanded="false"><span></span><span></span><span></span></button>
  </div>
  <nav class="nav__mobile" id="navMobile">
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="wishlist.html">Wishlist</a>
    <a href="cart.html">Cart</a>
  </nav>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-tabs">
      <button class="auth-tab is-active" id="loginTab">Log in</button>
      <button class="auth-tab" id="registerTab">Register</button>
    </div>

    <div class="demo-note">
      Demo account — <strong>buyer@example.com</strong> / <strong>Customer123!</strong><br>
      Admin login is at the bottom of this card.
    </div>

    <!-- LOGIN FORM -->
    <form id="loginForm">
      <div class="field">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" required>
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" required>
      </div>
      <button type="submit" class="btn btn--marigold btn--full">Log in</button>
      <p class="form-status" id="loginStatus" role="status" aria-live="polite"></p>
    </form>

    <!-- REGISTER FORM -->
    <form id="registerForm" style="display:none;">
      <div class="field">
        <label for="regName">Full name</label>
        <input type="text" id="regName" required>
      </div>
      <div class="field">
        <label for="regEmail">Email</label>
        <input type="email" id="regEmail" required>
      </div>
      <div class="field">
        <label for="regPassword">Password (min. 8 characters)</label>
        <input type="password" id="regPassword" minlength="8" required>
      </div>
      <div class="field">
        <label for="regPhone">Phone (optional)</label>
        <input type="tel" id="regPhone">
      </div>
      <div class="field">
        <label for="regAddress">Address (optional)</label>
        <input type="text" id="regAddress">
      </div>
      <button type="submit" class="btn btn--marigold btn--full">Create account</button>
      <p class="form-status" id="registerStatus" role="status" aria-live="polite"></p>
    </form>

    <p class="auth-switch" style="margin-top: 1.8rem; border-top: 1px solid var(--line); padding-top: 1.4rem;">
      Are you the admin? <a href="#" id="showAdminLogin">Log in here</a>
    </p>

    <!-- ADMIN LOGIN FORM -->
    <form id="adminLoginForm" style="display:none; margin-top: 1rem;">
      <div class="demo-note">Admin demo — <strong>admin@hunar.pk</strong> / <strong>Admin123!</strong></div>
      <div class="field">
        <label for="adminEmail">Admin email</label>
        <input type="email" id="adminEmail" required>
      </div>
      <div class="field">
        <label for="adminPassword">Password</label>
        <input type="password" id="adminPassword" required>
      </div>
      <button type="submit" class="btn btn--ghost btn--full">Log in as admin</button>
      <p class="form-status" id="adminLoginStatus" role="status" aria-live="polite"></p>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
